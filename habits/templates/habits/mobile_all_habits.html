{% extends "habits/base.html" %}

{% block body_class %}mobile-all-habits-page{% endblock %}

{% block content %}
<section class="hero">
    <div>
        <p class="eyebrow">Mobile menu</p>
        <div class="hero-title-row">
            <h1>All habits</h1>
            <a class="btn primary small mobile-create-inline" href="{% url 'habits:habit_create' %}">Create habit</a>
        </div>
        <p class="subtitle">{{ all_count }} total · drag to reorder</p>
    </div>
</section>

<section class="card-grid mobile-all-habits-grid">
    {% include "habits/partials/all_habits_card.html" %}
</section>
{% endblock %}

{% block scripts %}
<script>
    if (window.ConsistifyUI) {
        window.ConsistifyUI.enableHabitDragSort("habitSortList");
    }
</script>
{% endblock %}
